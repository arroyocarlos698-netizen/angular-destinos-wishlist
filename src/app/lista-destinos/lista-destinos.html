<section aria-labelledby="agregar-destino" class="mb-4">
  <h2 id="agregar-destino" class="h4">Agrega un destino</h2>
  <form #formulario (submit)="guardar(nombre.value, imagenUrl.value); $event.preventDefault(); formulario.reset()" class="row align-items-end">
    <div class="form-group col-md-5">
      <label for="nombre-destino">Nombre</label>
      <input id="nombre-destino" class="form-control" #nombre type="text" placeholder="Ej. Cartagena">
    </div>
    <div class="form-group col-md-5">
      <label for="imagen-destino">URL de imagen</label>
      <input id="imagen-destino" class="form-control" #imagenUrl type="url" placeholder="https://…">
    </div>
    <div class="form-group col-md-2">
      <button type="submit" class="btn btn-primary btn-block">Guardar</button>
    </div>
  </form>
</section>

<h2 class="h4">Mi lista</h2>
<ul class="row list-unstyled mb-0">
  <li app-destino-viaje *ngFor="let destino of destinos" [destino]="destino"></li>
</ul>
